<!doctype html>
<!--
  06 · Tarjeta flotante — diseño de promoción incluido en Gesha (1080×1920).
  Foto completa y una tarjeta redondeada con toda la información.
  Todos los diseños "base-…" comparten los mismos campos, así que una promo
  puede cambiar de diseño sin perder lo capturado. Copia esta carpeta como
  punto de partida para tu propia plantilla (.zip con index.html + style.css).
-->
<html lang="es">
<head>
<meta charset="utf-8"/>
<title>06 · Tarjeta flotante</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<main class="slide entra" data-logo="{{opt:logo_pos|arriba-derecha,arriba-izquierda,arriba-centro,abajo-izquierda,abajo-centro,abajo-derecha,oculto}}">
  <img class="foto" src="{{img:foto|https://images.unsplash.com/photo-1541167760496-1628856ab772?w=1400&q=80&auto=format&fit=crop}}" alt="" onerror="this.style.display='none'"/>
  <div class="velo"></div>
  <img class="logo" src="{{img:logo|/assets/isotipos/manta-02.svg}}" alt="" onerror="this.style.display='none'"/>
  <section class="texto">
    <p class="slogan">{{slogan|Nuevo}}</p>
    <h1 class="titulo">{{titulo|Matcha Raya}}</h1>
    <div class="precio">{{precio|$90}}</div>
    <ul class="contiene">{{list:contiene|Matcha ceremonial;Leche de avena;Miel de agave azul}}</ul>
  </section>
  <p class="tyc">{{tyc|Disponible caliente o frío. Imagen ilustrativa.}}</p>
</main>
<script>
  // El carrusel avisa cuando este slide entra: se reinicia la animación.
  addEventListener('message', (e) => {
    if (!e.data || e.data.type !== 'gesha:slide-active') return;
    const s = document.querySelector('.slide');
    s.classList.remove('entra');
    void s.offsetWidth;
    s.classList.add('entra');
  });
</script>
</body>
</html>
