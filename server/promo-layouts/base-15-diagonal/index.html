<!doctype html>
<!--
  15 · Corte diagonal — diseño de promoción incluido en Gesha (1080×1920).
  Foto arriba con corte diagonal y bloque de color abajo con toda la información.
  Todos los diseños "base-…" comparten los mismos campos, así que una promo
  puede cambiar de diseño sin perder lo capturado. Copia esta carpeta como
  punto de partida para tu propia plantilla (.zip con index.html + style.css).
-->
<html lang="es">
<head>
<meta charset="utf-8"/>
<title>15 · Corte diagonal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<style>.slide{--s-slogan:{{size:slogan|100}};--s-titulo:{{size:titulo|100}};--s-precio:{{size:precio|100}};--s-contiene:{{size:contiene|100}};--s-tyc:{{size:tyc|100}}}</style>
</head>
<body>
<main class="slide entra" data-logo="{{opt:logo_pos|arriba-derecha,arriba-izquierda,arriba-centro,abajo-izquierda,abajo-centro,abajo-derecha,oculto}}">
  <img class="foto" src="{{img:foto|https://images.unsplash.com/photo-1547573854-74d2a71d0826?w=1400&q=80&auto=format&fit=crop}}" alt="" style="object-position:{{pos:foto|50% 50%}}" onerror="this.style.display='none'"/>
  <div class="velo"></div>
  <img class="logo" src="{{img:logo|/assets/isotipos/manta-02.svg}}" alt="" onerror="this.style.display='none'"/>
  <section class="texto">
    <p class="slogan">{{slogan|Combo comida}}</p>
    <h1 class="titulo">{{titulo|Plato fuerte + bebida}}</h1>
    <div class="precio">{{precio|$129}}</div>
    <ul class="contiene">{{list:contiene|Guisado del día;Agua fresca o refresco;Postre de la casa}}</ul>
  </section>
  <p class="tyc">{{tyc|Lunes a viernes de 1 a 5 pm.}}</p>
</main>
<script>
  // El carrusel avisa cuando este slide entra: se reinicia la animación.
  addEventListener('message', (e) => {
    if (!e.data || e.data.type !== 'gesha:slide-active') return;
    const s = document.querySelector('.slide');
    s.classList.remove('entra');
    void s.offsetWidth;
    s.classList.add('entra');
  });
</script>
</body>
</html>
