<!doctype html>
<!--
  08 · Polaroid — diseño de promoción incluido en Gesha (1080×1920).
  Papel kraft, foto tipo polaroid inclinada y slogan manuscrito.
  Todos los diseños "base-…" comparten los mismos campos, así que una promo
  puede cambiar de diseño sin perder lo capturado. Copia esta carpeta como
  punto de partida para tu propia plantilla (.zip con index.html + style.css).
-->
<html lang="es">
<head>
<meta charset="utf-8"/>
<title>08 · Polaroid</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Caveat:wght@600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<main class="slide entra" data-logo="{{opt:logo_pos|abajo-centro,arriba-izquierda,arriba-centro,arriba-derecha,abajo-izquierda,abajo-derecha,oculto}}">
  <img class="foto" src="{{img:foto|https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?w=1400&q=80&auto=format&fit=crop}}" alt="" style="object-position:{{pos:foto|50% 50%}}" onerror="this.style.display='none'"/>
  <div class="velo"></div>
  <img class="logo" src="{{img:logo|/assets/isotipos/manta-03.svg}}" alt="" onerror="this.style.display='none'"/>
  <section class="texto">
    <p class="slogan">{{slogan|¡Recién horneado!}}</p>
    <h1 class="titulo">{{titulo|Pan dulce + café}}</h1>
    <div class="precio">{{precio|$65}}</div>
    <ul class="contiene">{{list:contiene|Concha, oreja o cuernito;Café americano chico}}</ul>
  </section>
  <p class="tyc">{{tyc|Hasta agotar existencias del día.}}</p>
</main>
<script>
  // El carrusel avisa cuando este slide entra: se reinicia la animación.
  addEventListener('message', (e) => {
    if (!e.data || e.data.type !== 'gesha:slide-active') return;
    const s = document.querySelector('.slide');
    s.classList.remove('entra');
    void s.offsetWidth;
    s.classList.add('entra');
  });
</script>
</body>
</html>
